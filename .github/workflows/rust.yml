name: Build

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

env:
  CARGO_TERM_COLOR: always
  # Opt-in Node.js 24 cho GitHub Actions (bắt buộc từ June 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact-name: windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact-name: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm install

      # Tauri yêu cầu thư mục frontendDist tồn tại dù app load URL từ xa
      - name: Create dist folder
        shell: bash
        run: mkdir -p dist

      - name: Download FFmpeg for macOS (ARM64)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p src-tauri/binaries
          curl -L "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip" -o /tmp/ffmpeg.zip
          unzip -o /tmp/ffmpeg.zip -d /tmp/ffmpeg-extract/
          cp /tmp/ffmpeg-extract/ffmpeg src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          chmod +x src-tauri/binaries/ffmpeg-aarch64-apple-darwin

      - name: Download FFmpeg for Windows (x64)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip" `
            -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-extract" -Force
          $ffmpeg = Get-ChildItem -Path "ffmpeg-extract" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $ffmpeg.FullName -Destination "src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"

      - name: Build Tauri app (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run build -- --bundles nsis
        env:
          # Build NSIS installer (.exe) — tương thích Windows 10+ x64
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Build Tauri app (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run build -- --bundles dmg
        env:
          # "-" = ad-hoc signing, không cần certificate, bỏ qua keychain lookup
          APPLE_SIGNING_IDENTITY: "-"

      - name: Upload Windows installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload macOS DMG
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
