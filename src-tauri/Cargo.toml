[package]
name = "hoc-long-tieng"
version = "0.1.0"
description = "Học Lồng Tiếng - Desktop App cho trẻ em"
authors = ["LittleCat Team"]
edition = "2021"

[lib]
name = "hoc_long_tieng_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "hoc-long-tieng"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
tempfile = "3"
regex = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
